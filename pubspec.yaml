name: personal_finance
description: A production-oriented personal finance app built with Flutter.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  cloud_firestore: ^6.0.0
  drift: ^2.28.0
  firebase_analytics: ^12.0.0
  firebase_auth: ^6.0.0
  firebase_core: ^4.0.0
  firebase_crashlytics: ^5.0.0
  firebase_storage: ^13.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_svg: ^2.3.0
  fpdart: ^1.1.1
  freezed_annotation: ^3.1.0
  get_it: ^8.2.0
  go_router: ^16.0.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  injectable: ^2.5.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  sqlite3_flutter_libs: ^0.5.29

dev_dependencies:
  build_runner: ^2.7.0
  drift_dev: ^2.28.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.1.0
  injectable_generator: ^2.7.0
  integration_test:
    sdk: flutter
  json_serializable: ^6.11.0
  mocktail: ^1.0.4

flutter:
  config:
    enable-swift-package-manager: true
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
