name: Flutter and Firebase Emulator checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: npm ci --prefix functions
      - run: npm --prefix functions run build
      - run: npm --prefix functions run test:projections
      - run: ./tool/run_rules_tests.sh
